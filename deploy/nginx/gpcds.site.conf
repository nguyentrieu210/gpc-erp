# GPC ERP — Nginx config for gpcds.site
# SSL managed by certbot

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name gpcds.site www.gpcds.site hoangdat.gpcds.site;
    return 301 https://$host$request_uri;
}

# Main HTTPS server
server {
    listen 443 ssl http2;
    server_name gpcds.site www.gpcds.site hoangdat.gpcds.site;

    ssl_certificate     /etc/letsencrypt/live/gpcds.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gpcds.site/privkey.pem;

    client_max_body_size 50m;

    # Proxy to Frappe bench serve
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Frappe-Site-Name hoangdat.gpcds.site;
        proxy_read_timeout 300s;
        proxy_redirect off;
    }

    # Static assets
    location /assets {
        alias /home/frappe/frappe-bench/sites/assets;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # WebSocket (Socket.IO)
    location /socket.io {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
