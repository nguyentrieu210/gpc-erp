# GPC ERP — Nginx subdomain routing cho gpcds.site
# gpcds.site → portal | hr.gpcds.site → /hr_app | banhang.gpcds.site → /kinhdoanh_app | ...
# SSL managed by certbot (setup with: certbot --nginx -d gpcds.site -d *.gpcds.site)

# ── HTTP → HTTPS ──────────────────────────────────────────────────
server {
    listen 80;
    server_name gpcds.site *.gpcds.site;
    return 301 https://$host$request_uri;
}

# ── Subdomain Map ──────────────────────────────────────────────────
# gpcds.site                    → /portal_app
# hr.gpcds.site                 → /hr_app
# banhang.gpcds.site            → /kinhdoanh_app
# tckt.gpcds.site               → /tckt_app
# crm.gpcds.site                → /crm_app
# muahang.gpcds.site            → /muahang_app
# kho.gpcds.site                → /kho_app
# duan.gpcds.site               → /duan_app
# quantri.gpcds.site            → /quantri_app
# taisan.gpcds.site             → /taisan_app

# ── gpcds.site → Portal ────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name gpcds.site www.gpcds.site;

    ssl_certificate     /etc/letsencrypt/live/gpcds.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gpcds.site/privkey.pem;
    client_max_body_size 50m;

    location /assets {
        alias /home/frappe/frappe-bench/sites/assets;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /socket.io {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location / {
        rewrite ^/$ /portal_app/ break;
        rewrite ^/(?!portal_app|api|assets)(.*)$ /portal_app/$1 break;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host hoangdat.gpcds.site;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

